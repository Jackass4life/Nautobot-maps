services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nautobot_maps
      POSTGRES_USER: nautobot_maps
      POSTGRES_PASSWORD: nautobot_maps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot_maps -d nautobot_maps"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-nautobot:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python demo/mock_nautobot.py
    volumes:
      # demo/ is excluded from the image by .dockerignore; mount the mock in.
      - ./mock_nautobot.py:/app/demo/mock_nautobot.py:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  nautobot-maps:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python app.py
    ports:
      - "5000:5000"
    environment:
      NAUTOBOT_URL: http://mock-nautobot:8080
      NAUTOBOT_TOKEN: demo-token
      FLASK_SECRET_KEY: demo-secret-key
      FLASK_DEBUG: "false"
      CACHE_TTL: "60"
      # The alert board reads from the persisted inventory snapshot, so the
      # demo needs a database (throwaway: no volume).
      NAUTOBOT_MAPS_DATABASE_URL: postgresql://nautobot_maps:nautobot_maps@postgres:5432/nautobot_maps
    depends_on:
      postgres:
        condition: service_healthy
      mock-nautobot:
        condition: service_healthy
