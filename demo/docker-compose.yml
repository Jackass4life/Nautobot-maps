services:
  postgres:
    image: postgres:16-alpine
    env_file: demo.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-nautobot:
    # The API image has FastAPI; the mock is its own program (demo/, not in the image).
    build: ../api
    entrypoint: ["python", "/mock/mock_nautobot.py"]
    # MOCK_SCALE=1200 in demo.env adds 1,200 generated sites (demo/README.md).
    env_file: demo.env
    volumes:
      - ./mock_nautobot.py:/mock/mock_nautobot.py:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The pages (#674), on port 5000 as before; the API's paths go on to `api`.
  web:
    build: ../web
    ports:
      - "5000:3000"
    env_file: demo.env
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../api
      additional_contexts:
        docs: ..
    # Every setting (#760: no defaults), then the demo's own.
    env_file: [../api/local.env, demo.env]
    depends_on:
      postgres:
        condition: service_healthy
      mock-nautobot:
        condition: service_healthy
