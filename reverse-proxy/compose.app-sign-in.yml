# reverse-proxy/compose.app-sign-in.yml - HTTPS in front of the app, which signs people
# in itself: sign-in with AD on its own page, /auth (#717, #723).  Instead of
# reverse-proxy/compose.yml (company sign-in through oauth2-proxy), never with it.
#
# nginx ends TLS and passes every request on; the identity headers are always empty,
# so nobody can claim a user by sending them.  The app checks the AD password, lets in
# people with an identity, and keeps their sign-in in an HttpOnly cookie; API tokens
# and the tenant status page work as with compose.yml.
#
# Use it on top of docker-compose.yml, e.g. in .env:
#   COMPOSE_FILE=docker-compose.yml:reverse-proxy/compose.app-sign-in.yml
# then `docker compose up -d`.  Settings: .env.example, "HTTPS and sign-in" and
# "Sign-in with AD"; docs/authentication.md, "Sign-in with AD".
# Paths here are relative to the project directory (where docker-compose.yml is).
# tests/test_proxy_compose.py keeps what this shares with compose.yml the same.
#
# Every setting is in .env (#739), the API's for this proxy too (AUTH_MODE=header,
# AUTH_REQUIRE_VIEWER, AUTH_TRUSTED_PROXIES, AUTH_PROXY_SECRET, LDAP_URL, LDAP_BASE_DN,
# JWT_SIGNING_SECRET; a company CA for the domain controller in EXTRA_CA_PEM). nginx
# refuses to start without the proxy's; the API without LDAP_BASE_DN or the secret.

services:
  # Only nginx talks to the pages and the API.
  web:
    ports: !reset []
    networks:
      - default
      - edge

  api:
    networks:
      - default
      - edge

  nginx:
    build:
      context: ./reverse-proxy
      args:
        DOMAIN: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
        # No oauth2-proxy: the app's own sign-in.
        SIGN_IN: app
        # The defaults: api:5000, web:3000, Docker's DNS.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    # AUTH_PROXY_SECRET.
    env_file: .env
    volumes:
      # The certificate, mounted: a new one needs only a restart, not a build.
      # tls.cert, tls.privkey (and tls.password for an encrypted key, #768).
      - ./reverse-proxy/certs:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      edge:
        # The one address the API trusts identity headers from.
        ipv4_address: ${PROXY_IP:-172.30.0.10}

networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
