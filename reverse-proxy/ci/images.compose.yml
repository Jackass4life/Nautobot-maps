# CI only (#672): the three per-folder images (api/, web/, reverse-proxy/Dockerfile) as a
# deployment would run them, with a stub in place of oauth2-proxy and the demo's mock
# Nautobot.  The images are built first (ci.yml, "images"), as the README's commands do:
#   docker compose -f reverse-proxy/ci/images.compose.yml up -d --wait
name: nautobot-maps-images

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=nautobot_maps
      - POSTGRES_USER=nautobot_maps
      - POSTGRES_PASSWORD=nautobot_maps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot_maps -d nautobot_maps"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-nautobot:
    image: nautobot-maps-api:ci
    # The API image has FastAPI; the mock is its own program (demo/, not in the image).
    entrypoint: ["python", "/mock/mock_nautobot.py"]
    volumes:
      - ../../demo/mock_nautobot.py:/mock/mock_nautobot.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  oauth2-proxy:
    image: python:3.12-alpine
    command: ["python", "/stub_oauth2_proxy.py"]
    volumes:
      - ./stub_oauth2_proxy.py:/stub_oauth2_proxy.py:ro

  # The API on 4200, as the request's `--build-arg API_PORT=4200` expects.
  api:
    image: nautobot-maps-api:ci
    environment:
      - NAUTOBOT_MAPS_DATABASE_URL=postgresql://nautobot_maps:nautobot_maps@postgres:5432/nautobot_maps
      - NAUTOBOT_URL=http://mock-nautobot:8080
      - NAUTOBOT_TOKEN=demo-token
      - GUNICORN_BIND=0.0.0.0:4200
      - HEALTHCHECK_PORT=4200
      - AUTH_MODE=header
      - AUTH_REQUIRE_VIEWER=true
      - AUTH_TRUSTED_PROXIES=172.31.0.10/32
      - AUTH_PROXY_SECRET=ci-proxy-secret-not-for-production
      - AUTH_SIGN_OUT_URL=/oauth2/sign_out
      - AUTH_OPERATOR_GROUPS=noc-operators
    depends_on:
      postgres:
        condition: service_healthy
      mock-nautobot:
        condition: service_healthy

  web:
    image: nautobot-maps-web:ci

  reverse-proxy:
    image: nautobot-maps-reverse-proxy:ci
    ports:
      - "80:80"
      - "443:443"
    environment:
      - AUTH_PROXY_SECRET=ci-proxy-secret-not-for-production
      - OIDC_ISSUER_URL=https://idp.example.com
      - OIDC_LOGOUT_URL=https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/
    networks:
      default:
        # The one address the API trusts identity headers from.
        ipv4_address: 172.31.0.10
    depends_on:
      - api
      - web
      - oauth2-proxy

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24
