# CI only (#423): the demo's mock Nautobot, so no Nautobot is needed.  With
# oauth2-proxy.compose.yml (a stub in its place, no identity provider) for
# reverse-proxy/compose.yml; alone for compose.app-sign-in.yml (#723).
#   docker compose -f docker-compose.yml -f reverse-proxy/compose.yml \
#       -f reverse-proxy/ci/compose.yml -f reverse-proxy/ci/oauth2-proxy.compose.yml up
services:
  mock-nautobot:
    # The API image has FastAPI; the mock is its own program (demo/, not in the image).
    build: ./api
    entrypoint: ["python", "/mock/mock_nautobot.py"]
    volumes:
      - ./demo/mock_nautobot.py:/mock/mock_nautobot.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      mock-nautobot:
        condition: service_healthy
