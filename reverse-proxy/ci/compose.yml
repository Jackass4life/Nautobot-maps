# CI only (#423): the proxy profile with a stub in place of oauth2-proxy and
# the demo's mock Nautobot, so no identity provider or Nautobot is needed.
#   docker compose -f docker-compose.yml -f reverse-proxy/compose.yml -f reverse-proxy/ci/compose.yml up
services:
  oauth2-proxy:
    image: python:3.12-alpine
    command: ["python", "/stub_oauth2_proxy.py"]
    environment: !reset []
    volumes:
      - ./reverse-proxy/ci/stub_oauth2_proxy.py:/stub_oauth2_proxy.py:ro

  mock-nautobot:
    # The API image has FastAPI; the mock is its own program (demo/, not in the image).
    build: ./api
    entrypoint: ["python", "/mock/mock_nautobot.py"]
    volumes:
      - ./demo/mock_nautobot.py:/mock/mock_nautobot.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      mock-nautobot:
        condition: service_healthy
