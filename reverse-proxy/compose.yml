# reverse-proxy/compose.yml - HTTPS and company sign-in in front of the app (#423).
#
# nginx ends TLS and asks oauth2-proxy whether each request is signed in
# (OIDC: Entra ID, Keycloak, Okta, Google, ...); the API gets the user and
# groups as headers (AUTH_MODE=header).  API tokens and the tenant status
# page skip the login: the API checks those itself.  nginx is the reverse-proxy
# image (reverse-proxy/Dockerfile, #674), built here with PUBLIC_HOSTNAME: it sends
# the API's paths to `api` and the pages to `web`.  After changing PUBLIC_HOSTNAME,
# `docker compose up -d --build`.
#
# Use it on top of docker-compose.yml, e.g. in .env:
#   COMPOSE_FILE=docker-compose.yml:reverse-proxy/compose.yml
# then `docker compose up -d`.  Settings: .env.example, "HTTPS and sign-in".
# Paths here are relative to the project directory (where docker-compose.yml is).
#
# Every setting is in .env (#739), the API's for this proxy too (AUTH_MODE=header,
# AUTH_REQUIRE_VIEWER, AUTH_TRUSTED_PROXIES, AUTH_PROXY_SECRET, AUTH_SIGN_OUT_URL);
# nginx refuses to start without them. oauth2-proxy's fixed settings are its command
# line below; its secrets come from .env under its own names (OAUTH2_PROXY_*).

services:
  # Only nginx talks to the pages and the API.
  web:
    ports: !reset []
    networks:
      - default
      - edge

  api:
    networks:
      - default
      - edge

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # OAUTH2_PROXY_CLIENT_SECRET and OAUTH2_PROXY_COOKIE_SECRET (oauth2-proxy stops
    # without them); with OIDC_CA_FILE, OAUTH2_PROXY_PROVIDER_CA_FILES too.
    env_file: .env
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      - --client-id=${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      - --scope=${OIDC_SCOPE:-openid email profile}
      - --oidc-groups-claim=${OIDC_GROUPS_CLAIM:-groups}
      # Entra ID often sends no email claim: preferred_username instead.
      - --oidc-email-claim=${OIDC_EMAIL_CLAIM:-email}
      - --email-domain=*
      - --redirect-url=https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}/oauth2/callback
      - --cookie-secure=true
      # Never sent on a cross-site POST: no change from another site's page.
      - --cookie-samesite=lax
      - --cookie-name=_nautobot_maps
      # Sign in again after 12 hours; the session is refreshed while in use.
      - --cookie-expire=12h
      - --cookie-refresh=1h
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      # nginx asks /oauth2/auth; the user and groups come back as X-Auth-Request-* headers.
      - --set-xauthrequest=true
      - --upstream=static://202
      - --skip-provider-button=true
      # PKCE (#527): Entra ID, Keycloak, Okta, Google and GitLab accept S256.
      - --code-challenge-method=S256
      - --whitelist-domain=${PUBLIC_HOSTNAME}
      # A company CA for the identity provider (#526): OIDC_CA_FILE, mounted below and
      # named in .env (OAUTH2_PROXY_PROVIDER_CA_FILES), trusted with the public CAs.
      - --use-system-trust-store=true
    volumes:
      # Nothing (/dev/null) without OIDC_CA_FILE; a missing file is an error,
      # not an empty directory made in its place.
      - type: bind
        source: ${OIDC_CA_FILE:-/dev/null}
        target: /etc/oauth2-proxy/provider-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge

  nginx:
    build:
      context: ./reverse-proxy
      args:
        DOMAIN: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
        # The defaults: api:5000, web:3000, oauth2-proxy:4180, Docker's DNS.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    # AUTH_PROXY_SECRET; after Sign out, the identity provider's logout (#546,
    # OIDC_LOGOUT_URL), else a page that links its sign-in (OIDC_ISSUER_URL).
    env_file: .env
    volumes:
      # The certificate, mounted: a new one needs only a restart, not a build.
      # tls.cert, tls.privkey (and tls.password for an encrypted key, #768).
      - ./reverse-proxy/certs:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
      - oauth2-proxy
    networks:
      edge:
        # The one address the API trusts identity headers from.
        ipv4_address: ${PROXY_IP:-172.30.0.10}

networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
