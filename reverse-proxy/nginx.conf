# nginx in front of Nautobot Maps (#423, #768): the whole configuration, as
# /etc/nginx/nginx.conf.  HTTPS, and sign-in: company sign-in through oauth2-proxy, or
# the app's own (#723, SIGN_IN=app: sign-in with AD on /auth).  The sign-in parts are
# the sign-in-*.inc files, from sign-in/<SIGN_IN>/ (Dockerfile).
#
# Filled in twice:
#   at build time, by substitute.py (the build args): ${DOMAIN}, ${API_HOST},
#     ${API_PORT}, ${WEB_HOST}, ${WEB_PORT}, ${OAUTH2_PROXY} and ${RESOLVER};
#   when the container starts, by nginx's entrypoint (never in the image):
#     ${AUTH_PROXY_SECRET}, ${OIDC_ISSUER_URL} and ${OIDC_LOGOUT_URL}.
# Everything else with a $ is nginx's own.  The upstreams are looked up through
# ${RESOLVER} as requests come in, so nginx starts before them.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  # Fallback in case we can't determine a type
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
           '$status $body_bytes_sent "$http_referer" '
           '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile           on;
  keepalive_timeout  65;
  server_tokens      off;

  # Docker's own DNS; a name is looked up again after 30 s (a restarted container).
  resolver ${RESOLVER} valid=30s;

  include /etc/nginx/sign-in-http.inc;

  # The name the app shows: the username, else the e-mail address.
  map $auth_user $auth_id {
    "" $auth_email;
    default $auth_user;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    set $api_upstream "http://${API_HOST}:${API_PORT}";
    set $auth_user "";
    set $auth_email "";
    set $auth_groups "";
    # Probes may use plain HTTP; everything else goes to HTTPS.
    location = /healthz {
      include /etc/nginx/proxy-to-api.inc;
    }
    location / {
      return 301 https://${DOMAIN}$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # The certificate, mounted at run time (reverse-proxy/certs/), never in the image.
    # tls.password: the key's password, for an encrypted key; without the file the
    # start removes this line (entrypoint/25-key-password-if-given.sh).
    ssl_certificate /etc/nginx/ssl/tls.cert;
    ssl_certificate_key /etc/nginx/ssl/tls.privkey;
    ssl_password_file /etc/nginx/ssl/tls.password;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    # The session cookie and the groups grow with a user's groups (Entra ID:
    # a 36-character ID each); nginx's 4-8 KB defaults would refuse them.
    large_client_header_buffers 4 32k;
    # The app compresses its answers (COMPRESS_RESPONSES); passed through as they are.
    gzip off;

    set $api_upstream "http://${API_HOST}:${API_PORT}";
    set $web_upstream "http://${WEB_HOST}:${WEB_PORT}";
    # Nobody signed in until the sign-in says so.
    set $auth_user "";
    set $auth_email "";
    set $auth_groups "";
    set $auth_cookie "";

    include /etc/nginx/sign-in-server.inc;

    # No login (the app checks access itself), and no identity passed on.
    location = /healthz {
      include /etc/nginx/proxy-to-api.inc;
    }
    # The tenant status page: customers have no company login; their status
    # token is checked by the app (#291).  Its files: the Nuxt build's
    # /_nuxt/ (#463), the app's code only, no data.
    location /status/ {
      include /etc/nginx/proxy-to-web.inc;
    }
    # Its data: a status token, or staff signed in (#527), never the login.  ^~:
    # before the API's regex location below, which would ask for the login.
    location ^~ /api/v1/status/ {
      include /etc/nginx/sign-in-optional.inc;
      include /etc/nginx/proxy-to-api.inc;
    }
    # Its old path (#613): the app answers 308 to /api/v1/status/, never the login.
    location ^~ /api/status/ {
      include /etc/nginx/sign-in-optional.inc;
      include /etc/nginx/proxy-to-api.inc;
    }
    location /_nuxt/ {
      include /etc/nginx/proxy-to-web.inc;
    }
    # Prometheus scrapes the app directly, inside the network.
    location = /metrics {
      return 404;
    }

    # Everything else: signed in, or an API token (sign-in-required.inc).  The API's paths (#672): /api/
    # (but /api/docs, a page), /mcp, the help pages' images and the old /docs,
    # /openapi.json and /static/ (redirects); the rest are pages.
    location ~ ^/(api/(?!docs(/|$))|mcp(/|$)|help/images/|docs(/|$)|openapi\.json$|static/) {
      include /etc/nginx/sign-in-required.inc;
      include /etc/nginx/proxy-to-api.inc;
    }
    location / {
      include /etc/nginx/sign-in-required.inc;
      include /etc/nginx/proxy-to-web.inc;
    }
  }
}
