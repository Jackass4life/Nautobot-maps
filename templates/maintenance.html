<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance · Nautobot Maps</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tooltip.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/multi-select.css') }}" />
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Nautobot Maps</p>
        <h1>Maintenance</h1>
      </div>
      {% set active = "maintenance" %}{% include "_nav.html" %}
    </header>

    <!-- Now and planned (#343), or the history of any period (#353). -->
    <nav class="maint-tabs" aria-label="Maintenance views">
      <a class="maint-tab{% if view != 'history' %} active{% endif %}" href="/maintenance"{% if view != 'history' %} aria-current="page"{% endif %}>Now &amp; planned</a>
      <a class="maint-tab{% if view == 'history' %} active{% endif %}" href="/maintenance?view=history"{% if view == 'history' %} aria-current="page"{% endif %}>History</a>
    </nav>

    <!-- The history's period, site and export (#353). -->
    <section id="maint-history-bar" class="toolbar maint-toolbar maint-history-bar" data-default-days="{{ history_days }}" hidden>
      <div class="period-field">
        <span class="period-label" id="period-label">Period</span>
        {% include "_period_popover.html" %}
      </div>
      <span id="maint-site-filter" class="maint-chip" hidden></span>
      <a id="maint-history-csv" class="secondary-filter-btn maint-csv" href="/api/maintenance/history.csv" download>Download CSV</a>
    </section>

    <!-- Current and planned work, as batches: a change planned for 30 sites is one line (#343). -->
    <section class="toolbar maint-toolbar">
      <input id="maint-search" class="avail-search" type="search" placeholder="Search site, device, reason or person" aria-label="Search maintenance" autocomplete="off" />
      <select id="maint-tenant" class="avail-tenant" aria-label="Tenant"><option value="">All tenants</option></select>
      <button id="maint-plan-open" class="maint-plan-open" type="button" aria-expanded="false" aria-controls="maint-plan">Plan maintenance</button>
      <p id="maint-status" class="maint-status" role="status">Loading…</p>
    </section>

    <!-- Plan: sites (search, or every site of a tenant), what, when, why (#343). -->
    <section id="maint-plan" class="table-shell maint-plan" aria-labelledby="maint-plan-title" hidden>
      <h2 id="maint-plan-title" class="availability-heading">Plan maintenance</h2>
      <form id="maint-plan-form" class="maint-form maint-plan-form" novalidate>
        <fieldset class="maint-fieldset maint-sites-fieldset">
          <legend>Sites</legend>
          <div class="maint-site-picker">
            <input id="maint-site-search" class="avail-search" type="search" placeholder="Site, path or tenant" aria-label="Find a site" autocomplete="off" aria-controls="maint-site-matches" />
            <ul id="maint-site-matches" class="maint-site-matches" role="listbox" aria-label="Matching sites" hidden></ul>
          </div>
          <ul id="maint-chosen" class="maint-chosen" aria-label="Chosen sites"></ul>
        </fieldset>
        <fieldset class="maint-fieldset">
          <legend>What</legend>
          <label class="maint-choice"><input type="radio" name="maint-scope" value="site" checked /> Whole sites</label>
          <label class="maint-choice"><input type="radio" name="maint-scope" value="devices" disabled /> Some devices <span class="maint-scope-note">(one site)</span></label>
          <div class="maint-devices case-device-list" hidden></div>
        </fieldset>
        <div id="maint-when"></div>
        <label class="case-input-label" for="maint-plan-reason">Reason</label>
        <input id="maint-plan-reason" class="case-input maint-reason" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Core switch upgrade" />
        <p class="maint-error" role="alert" hidden></p>
        <div class="maint-plan-actions">
          <button class="maint-save-btn" type="submit">Start maintenance</button>
          <button id="maint-plan-cancel" class="secondary-filter-btn" type="button">Close</button>
        </div>
      </form>
    </section>

    <div id="maint-groups" class="maint-groups" data-limit="25" data-recent-days="{{ recent_days }}" data-max-sites="{{ max_sites }}"></div>
    <noscript><p class="availability-note">This page needs JavaScript. The API is <a href="/docs">/api/maintenance</a>.</p></noscript>
  </div>
  <script type="module" src="{{ url_for('static', filename='js/maintenance/main.js') }}"></script>
</body>
</html>
