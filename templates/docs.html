<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nautobot Maps API</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}" />
  <!-- Swagger UI 5.33.1 (Apache 2.0, vendor/swagger-ui.LICENSE.txt; #436) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/swagger-ui.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/docs.css') }}" />
</head>
<body>
  {%- set active = "docs" %}{% include "_nav.html" %}
  <div class="page-shell docs-shell">
    <header class="page-header">
      <div>
        <h1>API</h1>
        <p class="page-subtitle">
          Every endpoint, what it takes and what it needs. <strong>Try it out</strong> sends a real request as you:
          your login and role apply, and POST and DELETE change data.
          As OpenAPI: <a href="/openapi.json">/openapi.json</a>.
        </p>
      </div>
    </header>
    <!-- Swagger UI draws the API here, from /openapi.json (#436). -->
    <div id="swagger-ui" class="docs-swagger"></div>
    <noscript><p>This page needs JavaScript. The API as JSON: <a href="/openapi.json">/openapi.json</a>.</p></noscript>
  </div>
  <script src="{{ url_for('static', filename='vendor/swagger-ui-bundle.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/docs/main.js') }}"></script>
</body>
</html>
