<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>{{ tenant }} · Status</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alerts.css') }}" />
</head>
<!-- A tenant's status page (#291): the data comes from /api/status/. -->
<body class="status-page" data-tenant="{{ tenant }}">
  <main class="status-shell">
    <p class="eyebrow">Service status</p>
    <h1 id="status-tenant">{{ tenant }}</h1>
    <p id="status-headline" class="status-headline" role="status" aria-live="polite">Loading…</p>
    <ul id="status-sites" class="status-sites"></ul>
    <!-- A large tenant's operational sites, folded into one line (#407). -->
    <div id="status-operational"></div>
    <p id="status-updated" class="status-updated"></p>
  </main>
  <script type="module" src="{{ url_for('static', filename='js/status/main.js') }}"></script>
</body>
</html>
