{#- The period button and its popover (#341, #353): Availability and the
    maintenance history; lib/period-picker.js wires it.  Inside a .period-field. -#}
<button id="period-button" class="period-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="period-popover" aria-describedby="period-label" hidden></button>
<div id="period-popover" class="period-popover" role="dialog" aria-label="Choose a period" hidden>
  <div class="period-presets" role="group" aria-label="Quick choices">
    <button type="button" class="period-preset" data-preset="this-month">This month</button>
    <button type="button" class="period-preset" data-preset="last-month">Last month</button>
    <button type="button" class="period-preset" data-preset="last-7">Last 7 days</button>
    <button type="button" class="period-preset" data-preset="last-30">Last 30 days</button>
  </div>
  <div class="calendar period-calendar"></div>
  <p class="period-hint">Click the first day, then the last.</p>
</div>
