# ruff for the files outside api/ and web/ (e2e, demo, scripts, development,
# reverse-proxy/ci): `uv run --project api ruff check .` from the repository root.

[tool.ruff]
target-version = "py311"
# Matches how the code is already written (least churn for `ruff format`).
line-length = 120
# api/ has its own ruff config and CI job (#572).
extend-exclude = ["api", "web"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused/undefined names), B: bugbear (likely
# bugs), I: import sorting, UP: modern Python syntax for the target version.
select = ["E", "W", "F", "B", "I", "UP"]
# Line length is the formatter's job; the few lines it cannot wrap (long
# strings, URLs) are fine as they are.
ignore = ["E501"]

[tool.pytest.ini_options]
# e2e/ (Playwright against a running app): `uv run --project api python -m pytest e2e/`.
testpaths = ["e2e"]
