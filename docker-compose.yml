# docker-compose.yml - Nautobot Maps (production / quick-start)
#
# Start:   docker compose up --build -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
#
# NOTE: Do NOT use "docker compose build && docker compose start".
# "start" only restarts previously created containers and will fail with
# "has no container to start" on a fresh checkout.  Always use
# "docker compose up" which both creates and starts containers.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nautobot_maps}
      - POSTGRES_USER=${POSTGRES_USER:-nautobot_maps}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nautobot_maps}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nautobot_maps} -d ${POSTGRES_DB:-nautobot_maps}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nautobot-maps:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - NAUTOBOT_URL=${NAUTOBOT_URL}
      - NAUTOBOT_TOKEN=${NAUTOBOT_TOKEN}
      - NAUTOBOT_VERIFY_SSL=${NAUTOBOT_VERIFY_SSL:-true}
      - NAUTOBOT_API_VERSION=${NAUTOBOT_API_VERSION:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me}
      - CACHE_TTL=${CACHE_TTL:-300}
      - CACHE_TYPE=${CACHE_TYPE:-RedisCache}
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://redis:6379/0}
      # Gunicorn (optional; defaults: 4 workers, 120 s timeout, bind chosen by AUTH_MODE)
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-}
      - GUNICORN_BIND=${GUNICORN_BIND:-}
      # Background syncs and sync intervals (optional; default to CACHE_TTL)
      - BACKGROUND_SYNC_ENABLED=${BACKGROUND_SYNC_ENABLED:-}
      - INVENTORY_SYNC_INTERVAL_SECONDS=${INVENTORY_SYNC_INTERVAL_SECONDS:-}
      - LIBRENMS_SYNC_INTERVAL_SECONDS=${LIBRENMS_SYNC_INTERVAL_SECONDS:-}
      # Criticality configuration (all optional)
      - CRITICAL_ROLE_KEYWORDS=${CRITICAL_ROLE_KEYWORDS:-}
      - CRITICALITY_RULES_FILE=${CRITICALITY_RULES_FILE:-}
      # Alert board exclusions (all optional; see .env.example). "-" instead of
      # ":-" so an empty value in .env clears the location-type default.
      - ALERT_BOARD_EXCLUDED_LOCATION_TYPES=${ALERT_BOARD_EXCLUDED_LOCATION_TYPES-graveyard,warehouse}
      - ALERT_BOARD_EXCLUDED_LOCATION_STATUSES=${ALERT_BOARD_EXCLUDED_LOCATION_STATUSES:-}
      - ALERT_BOARD_EXCLUDED_LOCATION_TAGS=${ALERT_BOARD_EXCLUDED_LOCATION_TAGS:-}
      - ALERT_BOARD_EXCLUDED_LOCATION_NAMES=${ALERT_BOARD_EXCLUDED_LOCATION_NAMES:-}
      - ALERT_BOARD_EXCLUDED_DEVICE_STATUSES=${ALERT_BOARD_EXCLUDED_DEVICE_STATUSES:-}
      - ALERT_BOARD_SITE_LOCATION_TYPE=${ALERT_BOARD_SITE_LOCATION_TYPE:-}
      # Optional authentication / RBAC
      - AUTH_MODE=${AUTH_MODE:-disabled}
      - AUTH_HEADER_USER=${AUTH_HEADER_USER:-X-Forwarded-User}
      - AUTH_HEADER_GROUPS=${AUTH_HEADER_GROUPS:-X-Forwarded-Groups}
      - AUTH_DEFAULT_ROLE=${AUTH_DEFAULT_ROLE:-}
      - AUTH_VIEWER_GROUPS=${AUTH_VIEWER_GROUPS:-}
      - AUTH_OPERATOR_GROUPS=${AUTH_OPERATOR_GROUPS:-}
      - AUTH_ADMIN_GROUPS=${AUTH_ADMIN_GROUPS:-}
      # LibreNMS integration (optional)
      - LIBRENMS_URL=${LIBRENMS_URL:-}
      - LIBRENMS_API_TOKEN=${LIBRENMS_API_TOKEN:-}
      - LIBRENMS_VERIFY_SSL=${LIBRENMS_VERIFY_SSL:-true}
      # PostgreSQL persistence: the bundled postgres service unless overridden.
      - NAUTOBOT_MAPS_DATABASE_URL=${NAUTOBOT_MAPS_DATABASE_URL-postgresql://${POSTGRES_USER:-nautobot_maps}:${POSTGRES_PASSWORD:-nautobot_maps}@postgres:5432/${POSTGRES_DB:-nautobot_maps}}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
