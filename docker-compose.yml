# docker-compose.yml - Nautobot Maps (production / quick-start)
#
# Start:   docker compose up --build -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
#
# Two images (#674): `api` (api/Dockerfile) and `web`, the pages (web/Dockerfile).
# Open http://<host>:5000: `web` answers there and passes the API's paths on to `api`.
# The bundled HTTPS and sign-in proxy goes in front with reverse-proxy/compose.yml.
#
# Every setting is in .env (#739): each container gets the whole file (env_file), so
# nothing is set here. Copy .env.example to .env and `chmod 600 .env`: it holds the
# passwords. Compose itself reads .env too, for the ports and networks below.
#
# NOTE: Do NOT use "docker compose build && docker compose start".
# "start" only restarts previously created containers and will fail with
# "has no container to start" on a fresh checkout.  Always use
# "docker compose up" which both creates and starts containers.

# Docker keeps container logs forever by default; cap them (#193).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD.
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The container's own settings ($$: not compose's interpolation).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:3000"
    # API_URL (the API's paths go there, #674) and MAP_TILE_URL (the pages' CSP).
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      # The help pages' files: docs/, README.md, CONTRIBUTING.md (api/Dockerfile).
      additional_contexts:
        docs: .
    logging: *default-logging
    # Not published: `web` passes the API's paths on (and Prometheus scrapes it
    # inside the network, or through `web` at /metrics). Its settings: .env.
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
