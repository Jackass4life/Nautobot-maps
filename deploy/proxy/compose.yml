# deploy/proxy/compose.yml - HTTPS and company sign-in in front of the app (#423).
#
# nginx ends TLS and asks oauth2-proxy whether each request is signed in
# (OIDC: Entra ID, Keycloak, Okta, Google, ...); the app gets the user and
# groups as headers (AUTH_MODE=header).  API tokens and the tenant status
# page skip the login: the app checks those itself.
#
# Use it on top of docker-compose.yml, e.g. in .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/proxy/compose.yml
# then `docker compose up -d`.  Settings: .env.example, "HTTPS and sign-in".
# Paths here are relative to the project directory (where docker-compose.yml is).

services:
  nautobot-maps:
    # Only nginx talks to the app.
    ports: !reset []
    environment:
      - AUTH_MODE=header
      # Paths that skip the login (status page, API tokens) still need a token.
      - AUTH_REQUIRE_VIEWER=true
      - AUTH_TRUSTED_PROXIES=${PROXY_IP:-172.30.0.10}/32
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?set AUTH_PROXY_SECRET (see .env.example)}
    networks:
      - default
      - edge

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      - OAUTH2_PROXY_CLIENT_ID=${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      - OAUTH2_PROXY_SCOPE=${OIDC_SCOPE:-openid email profile}
      - OAUTH2_PROXY_OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      # Entra ID often sends no email claim: preferred_username instead.
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=${OIDC_EMAIL_CLAIM:-email}
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_REDIRECT_URL=https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}/oauth2/callback
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET:?set OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_SECURE=true
      # Never sent on a cross-site POST: no change from another site's page.
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_COOKIE_NAME=_nautobot_maps
      # Sign in again after 12 hours; the session is refreshed while in use.
      - OAUTH2_PROXY_COOKIE_EXPIRE=12h
      - OAUTH2_PROXY_COOKIE_REFRESH=1h
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      # nginx asks /oauth2/auth; the user and groups come back as X-Auth-Request-* headers.
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      # PKCE (#527): Entra ID, Keycloak, Okta, Google and GitLab accept S256.
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - OAUTH2_PROXY_WHITELIST_DOMAINS=${PUBLIC_HOSTNAME}
      # A company CA for the identity provider (#526): OIDC_CA_FILE, trusted
      # together with the public CAs. Unset: the public CAs only (an empty
      # variable counts as not set).
      - OAUTH2_PROXY_PROVIDER_CA_FILES=${OIDC_CA_FILE:+/etc/oauth2-proxy/provider-ca.pem}
      - OAUTH2_PROXY_USE_SYSTEM_TRUST_STORE=true
    volumes:
      # Nothing (/dev/null) without OIDC_CA_FILE; a missing file is an error,
      # not an empty directory made in its place.
      - type: bind
        source: ${OIDC_CA_FILE:-/dev/null}
        target: /etc/oauth2-proxy/provider-ca.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?set AUTH_PROXY_SECRET}
      # Only these are filled into the templates; nginx's own $variables stay.
      - NGINX_ENVSUBST_FILTER=^(PUBLIC_HOSTNAME|AUTH_PROXY_SECRET)$
    volumes:
      - ./deploy/proxy/templates:/etc/nginx/templates:ro
      - ./deploy/proxy/certs:/etc/nginx/certs:ro
      # Listens on IPv6 only where the host has it (#527).
      - ./deploy/proxy/entrypoint/30-listen-ipv6-only-if-available.sh:/docker-entrypoint.d/30-listen-ipv6-only-if-available.sh:ro
    depends_on:
      - nautobot-maps
      - oauth2-proxy
    networks:
      edge:
        # The one address the app trusts identity headers from.
        ipv4_address: ${PROXY_IP:-172.30.0.10}

networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
