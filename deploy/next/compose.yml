# The new stack (#577): PostgreSQL + api/ + web/.
#   cd deploy/next && cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d --build --wait
# web: http://localhost:3000, api: http://localhost:8000 (spec at /api/openapi.json).
name: nautobot-maps-next

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ../../api
    environment:
      # The password goes separately: no URL encoding needed for "@", "%", ...
      DATABASE_URL: postgresql+psycopg://app@postgres:5432/app
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # The browser calls the API from the web page's origin.
      CORS_ORIGINS: '["${WEB_PUBLIC_URL:-http://localhost:3000}"]'
      # Sign-in (#582), see api/README.md. header mode: AUTH_TRUSTED_PROXIES must
      # cover the sign-in proxy and the web container (it forwards the headers), and
      # AUTH_PROXY_SECRET must be set (web forwards only requests carrying it).
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      AUTH_VIEWER_GROUPS: ${AUTH_VIEWER_GROUPS:-}
      AUTH_OPERATOR_GROUPS: ${AUTH_OPERATOR_GROUPS:-}
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-}
      AUTH_REQUIRE_VIEWER: ${AUTH_REQUIRE_VIEWER:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../../web
    environment:
      # What the browser calls; server-side rendering uses the internal address.
      NUXT_PUBLIC_API_BASE: ${API_PUBLIC_URL:-http://localhost:8000}
      NUXT_API_BASE_SERVER: http://api:8000
      # Server-side rendering forwards identity headers only with this secret (#582).
      NUXT_AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
