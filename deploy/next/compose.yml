# The new stack (#577): PostgreSQL + api/ + web/.
#   cd deploy/next && cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d --build --wait
# web: http://localhost:3000, api: http://localhost:8000 (spec at /api/openapi.json).
name: nautobot-maps-next

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ../../api
    environment:
      # The password goes separately: no URL encoding needed for "@", "%", ...
      DATABASE_URL: postgresql+psycopg://app@postgres:5432/app
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # The browser calls the API from the web page's origin.
      CORS_ORIGINS: '["${WEB_PUBLIC_URL:-http://localhost:3000}"]'
      # Sign-in (#582), see api/README.md. header mode: AUTH_TRUSTED_PROXIES must
      # cover the sign-in proxy and the web container (it forwards the headers), and
      # AUTH_PROXY_SECRET must be set (web forwards only requests carrying it).
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      AUTH_HEADER_USER: ${AUTH_HEADER_USER:-X-Forwarded-User}
      AUTH_HEADER_GROUPS: ${AUTH_HEADER_GROUPS:-X-Forwarded-Groups}
      AUTH_VIEWER_GROUPS: ${AUTH_VIEWER_GROUPS:-}
      AUTH_OPERATOR_GROUPS: ${AUTH_OPERATOR_GROUPS:-}
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-}
      AUTH_DEFAULT_ROLE: ${AUTH_DEFAULT_ROLE:-}
      AUTH_REQUIRE_VIEWER: ${AUTH_REQUIRE_VIEWER:-false}
      # Every other setting (#588), as the current docker-compose.yml passes them
      # (the same defaults); see docs/configuration.md. The database is DATABASE_URL
      # above, so NAUTOBOT_MAPS_DATABASE_URL isn't passed. No Redis here (yet): SimpleCache.
      NAUTOBOT_URL: ${NAUTOBOT_URL}
      NAUTOBOT_TOKEN: ${NAUTOBOT_TOKEN}
      NAUTOBOT_VERIFY_SSL: ${NAUTOBOT_VERIFY_SSL:-true}
      NAUTOBOT_API_VERSION: ${NAUTOBOT_API_VERSION:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      CACHE_TTL: ${CACHE_TTL:-300}
      CACHE_TYPE: ${CACHE_TYPE:-SimpleCache}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-}
      GUNICORN_BIND: ${GUNICORN_BIND:-}
      BACKGROUND_SYNC_ENABLED: ${BACKGROUND_SYNC_ENABLED:-}
      INVENTORY_SYNC_INTERVAL_SECONDS: ${INVENTORY_SYNC_INTERVAL_SECONDS:-}
      LIBRENMS_SYNC_INTERVAL_SECONDS: ${LIBRENMS_SYNC_INTERVAL_SECONDS:-}
      ALERTMANAGER_DEVICE_LABELS: ${ALERTMANAGER_DEVICE_LABELS:-}
      ALERTMANAGER_ALERTNAMES: ${ALERTMANAGER_ALERTNAMES:-}
      WEBHOOK_ALERT_TTL_HOURS: ${WEBHOOK_ALERT_TTL_HOURS:-}
      CRITICAL_ROLE_KEYWORDS: ${CRITICAL_ROLE_KEYWORDS:-}
      CRITICALITY_RULES_FILE: ${CRITICALITY_RULES_FILE:-}
      ALERT_BOARD_EXCLUDED_LOCATION_TYPES: ${ALERT_BOARD_EXCLUDED_LOCATION_TYPES-graveyard,warehouse}
      ALERT_BOARD_EXCLUDED_LOCATION_STATUSES: ${ALERT_BOARD_EXCLUDED_LOCATION_STATUSES:-}
      ALERT_BOARD_EXCLUDED_LOCATION_TAGS: ${ALERT_BOARD_EXCLUDED_LOCATION_TAGS:-}
      ALERT_BOARD_EXCLUDED_LOCATION_NAMES: ${ALERT_BOARD_EXCLUDED_LOCATION_NAMES:-}
      ALERT_BOARD_EXCLUDED_DEVICE_STATUSES: ${ALERT_BOARD_EXCLUDED_DEVICE_STATUSES:-}
      ALERT_DELAY_SECONDS: ${ALERT_DELAY_SECONDS:-}
      FLAP_CHANGES: ${FLAP_CHANGES:-}
      AVAILABILITY_BASIS: ${AVAILABILITY_BASIS:-}
      AVAILABILITY_TARGET_PCT: ${AVAILABILITY_TARGET_PCT:-}
      CASE_URL_TEMPLATE: ${CASE_URL_TEMPLATE:-}
      ALERT_MEDIUM_PERCENT: ${ALERT_MEDIUM_PERCENT:-}
      ALERT_CRITICAL_PERCENT: ${ALERT_CRITICAL_PERCENT:-}
      SITE_TIER_FIELD: ${SITE_TIER_FIELD:-}
      TENANT_SCOPE_FIELD: ${TENANT_SCOPE_FIELD:-}
      STATUS_PAGE_TENANT_DEVICES: ${STATUS_PAGE_TENANT_DEVICES:-false}
      COUNTRY_LOCATION_TYPE: ${COUNTRY_LOCATION_TYPE:-}
      SITE_TIERS: ${SITE_TIERS:-}
      NOTIFY_MIN_LEVEL_BY_TIER: ${NOTIFY_MIN_LEVEL_BY_TIER:-}
      TIER_DEVICE_LEVEL: ${TIER_DEVICE_LEVEL:-}
      DEVICE_CRITICALITY_FIELD: ${DEVICE_CRITICALITY_FIELD:-}
      ALERT_BOARD_SITE_LOCATION_TYPE: ${ALERT_BOARD_SITE_LOCATION_TYPE:-}
      SITE_TENANT_RELATIONSHIPS: ${SITE_TENANT_RELATIONSHIPS:-}
      ACCESS_POINT_ROLES: ${ACCESS_POINT_ROLES:-Access Point}
      AUTH_SIGN_OUT_URL: ${AUTH_SIGN_OUT_URL:-}
      ALLOW_UNAUTHENTICATED_WRITES: ${ALLOW_UNAUTHENTICATED_WRITES:-}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_DEFAULT_VIEW: ${MAP_DEFAULT_VIEW:-}
      GEOCODER_ENABLED: ${GEOCODER_ENABLED:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
      LIBRENMS_URL: ${LIBRENMS_URL:-}
      LIBRENMS_API_TOKEN: ${LIBRENMS_API_TOKEN:-}
      LIBRENMS_VERIFY_SSL: ${LIBRENMS_VERIFY_SSL:-true}
      WIRELESS_CONTROLLERS_FILE: ${WIRELESS_CONTROLLERS_FILE:-}
      WIRELESS_SYNC_INTERVAL_SECONDS: ${WIRELESS_SYNC_INTERVAL_SECONDS:-}
      WIRELESS_AP_LEVEL: ${WIRELESS_AP_LEVEL:-low}
      ALERT_HISTORY_RETENTION_DAYS: ${ALERT_HISTORY_RETENTION_DAYS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-}
      MCP_ENABLED: ${MCP_ENABLED:-}
      COMPRESS_RESPONSES: ${COMPRESS_RESPONSES:-}
      NOTIFY_MIN_LEVEL: ${NOTIFY_MIN_LEVEL:-}
      NOTIFY_TENANTS: ${NOTIFY_TENANTS:-}
      NOTIFY_BOARD_URL: ${NOTIFY_BOARD_URL:-}
      NOTIFY_SUMMARY_THRESHOLD: ${NOTIFY_SUMMARY_THRESHOLD:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_TEAMS_WEBHOOK_URL: ${NOTIFY_TEAMS_WEBHOOK_URL:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../../web
    environment:
      # What the browser calls; server-side rendering uses the internal address.
      NUXT_PUBLIC_API_BASE: ${API_PUBLIC_URL:-http://localhost:8000}
      NUXT_API_BASE_SERVER: http://api:8000
      # Server-side rendering forwards identity headers only with this secret (#582).
      NUXT_AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      # The API's AUTH_HEADER_USER / AUTH_HEADER_GROUPS, comma-separated.
      NUXT_AUTH_FORWARD_HEADERS: ${AUTH_FORWARD_HEADERS:-x-forwarded-user,x-forwarded-groups}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
