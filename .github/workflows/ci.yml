name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint: ruff for the files outside api/ and web/ (e2e, demo, scripts, the
  # proxy's CI), with the root pyproject.toml's settings and api/'s ruff
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Ruff lint
        # github format turns findings into annotations on the PR diff.
        run: uv run --project api --locked ruff check --output-format=github .

      - name: Ruff format
        # Also runs when lint fails, so one CI run reports both.
        if: success() || failure()
        run: uv run --project api --locked ruff format --check --diff .

      - name: No committed dependencies
        # node_modules is git-ignored; a `git add -A` after an install once
        # committed 941 files of it (#189).
        if: success() || failure()
        run: test -z "$(git ls-files node_modules web/node_modules)"

  # -----------------------------------------------------------------------
  # The new backend, api/ (#572): its own uv project, ruff, migrations, tests
  # (incl. "web/api/openapi.json is the app's spec").
  # -----------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_test
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: "postgresql://api:api@127.0.0.1:5432/api_test"
      API_TEST_DATABASE_URL: "postgresql://api:api@127.0.0.1:5432/api_test"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Install
        # --locked: fails if uv.lock doesn't match pyproject.toml.
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        if: success() || failure()
        run: uv run ruff format --check --diff .

      - name: Migrations apply
        if: success() || failure()
        run: uv run alembic upgrade head

      - name: Tests
        if: success() || failure()
        run: uv run pytest -v

  # -----------------------------------------------------------------------
  # The new frontend, web/ (#572): API types current, types, build.
  # -----------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Install
        # Install scripts don't run; `nuxt prepare` makes the generated types.
        # --bun everywhere: the tools run on bun, as in the image (#635).
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun --bun x nuxt prepare

      - name: The API types match web/api/openapi.json
        # The api job checks openapi.json is the API's spec.
        run: |
          bun --bun run api:generate
          git diff --exit-code api/api.schema.ts

      - name: Types
        if: success() || failure()
        run: bun --bun run type:check

      - name: Lint (#609)
        if: success() || failure()
        run: bun --bun run lint

      - name: Formatting (#669)
        if: success() || failure()
        run: bun --bun run format:check

      - name: Unit tests (vitest, #609)
        if: success() || failure()
        run: bun --bun run test

      - name: Static build (no inline scripts, #594)
        if: success() || failure()
        run: bun --bun run generate

  # -----------------------------------------------------------------------
  # Known vulnerabilities in the locked dependencies (#186)
  # -----------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Python dependencies (pip-audit, api/uv.lock)
        working-directory: api
        # Every group: the image's packages, the dev tools and Playwright.
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt > requirements.audit.txt
          uv tool run pip-audit --strict --require-hashes --disable-pip -r requirements.audit.txt

      - name: The pages (bun audit, #463, #635)
        # High or critical fails, except the advisories scripts/audit.mjs
        # accepts, each with no fix released and out of production's reach.
        if: success() || failure()
        working-directory: web
        run: bun --bun scripts/audit.mjs

  # -----------------------------------------------------------------------
  # End-to-end in Chromium (#294): the app with the mock Nautobot and
  # PostgreSQL, driven like a user (board, + Case, history export, wall,
  # map, availability, status page), in light and dark.
  # -----------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nautobot_maps
          POSTGRES_USER: nautobot_maps
          POSTGRES_PASSWORD: nautobot_maps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nautobot_maps -d nautobot_maps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NAUTOBOT_URL: "http://127.0.0.1:8080"
      NAUTOBOT_TOKEN: "demo-token"
      NAUTOBOT_MAPS_DATABASE_URL: "postgresql://nautobot_maps:nautobot_maps@127.0.0.1:5432/nautobot_maps"
      FLASK_RUN_PORT: "5055"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Install the API, Playwright and Chromium
        working-directory: api
        run: |
          uv sync --locked --group e2e
          uv run python -m playwright install --with-deps chromium

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Build the pages (#609)
        working-directory: web
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun --bun run generate

      - name: Start the mock Nautobot and the app (#613)
        run: |
          uv run --project api python demo/mock_nautobot.py > mock.log 2>&1 &
          (cd api && uv run python -m app migrate)
          (cd api && uv run python run.py) > app.log 2>&1 &
          # Ready when the first inventory sync has filled the board.
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5055/api/v1/alerts | grep -q '"name"'; then exit 0; fi
            sleep 1
          done
          echo "The app did not become ready within 60s" >&2
          exit 1

      - name: Run end-to-end tests
        # Maintenance needs the operator role (#343): a token for the tests that plan some.
        run: |
          export E2E_OPERATOR_TOKEN="$(cd api && uv run python -m app token create e2e --role operator --expires-days 1 | head -n 1)"
          # The Admin page and sharing a status page need the admin role (#530).
          export E2E_ADMIN_TOKEN="$(cd api && uv run python -m app token create e2e-admin --role admin --expires-days 1 | head -n 1)"
          uv run --project api python -m pytest e2e/ -v
        env:
          E2E_BASE_URL: "http://127.0.0.1:5055"

      - name: App and mock logs on failure
        if: failure()
        run: tail -n 200 app.log mock.log

  # -----------------------------------------------------------------------
  # Integration tests against a real Nautobot 3.x instance
  # -----------------------------------------------------------------------
  integration-nautobot:
    runs-on: ubuntu-latest

    services:
      # api/'s live test (#600): its own database, beside the Nautobot stack's.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_test
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U api -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Nautobot stack
        working-directory: development
        run: docker compose up -d --wait --wait-timeout 300

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Seed Nautobot with test data
        run: uv run --project api --locked python development/seed_nautobot.py
        env:
          NAUTOBOT_URL: "http://localhost:8080"
          NAUTOBOT_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"

      - name: The sync and the clients against the real Nautobot (#600)
        working-directory: api
        run: |
          uv sync --locked
          uv run pytest tests/test_nautobot_live.py -v
        env:
          API_TEST_DATABASE_URL: "postgresql://api:api@127.0.0.1:5433/api_test"
          NAUTOBOT_LIVE_URL: "http://localhost:8080"
          NAUTOBOT_LIVE_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"

      - name: Dump Nautobot logs on failure
        if: failure()
        working-directory: development
        run: docker compose logs nautobot --tail=200

  # -----------------------------------------------------------------------
  # Docker smoke test: build the image and run the demo stack for real
  # -----------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The images are scanned by the images job (#674): the same Dockerfiles.
      - name: The compose files are valid on their own and with the proxy
        env:
          PUBLIC_HOSTNAME: maps.example.com
          AUTH_PROXY_SECRET: x
          OIDC_ISSUER_URL: https://idp.example.com
          OIDC_CLIENT_ID: x
          OIDC_CLIENT_SECRET: x
          OAUTH2_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f reverse-proxy/compose.yml config -q

      - name: Build and start the demo stack
        # --wait blocks until every container is running and healthy
        # (api and web via their images' HEALTHCHECK, the mock via its compose one).
        run: docker compose -f demo/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: The API and the pages run as non-root users
        run: |
          for service in api web; do
            uid=$(docker compose -f demo/docker-compose.yml exec -T "$service" id -u)
            echo "$service: uid=$uid"
            test "$uid" != "0"
          done

      - name: Health endpoint and alert board work end to end
        # On port 5000, the web image's: it passes the API's paths on to the API.
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:5000" + path, timeout=10) as resp:
                  return json.load(resp)

          health = get("/healthz")
          print("healthz:", health)
          assert health["status"] == "ok", health

          # Fresh database: the first request starts the sync; poll like the UI.
          deadline = time.monotonic() + 90
          board = get("/api/v1/alerts")
          while (board.get("sync_pending") or not board["alerts"]) and time.monotonic() < deadline:
              time.sleep(2)
              board = get("/api/v1/alerts")
          london = next(site for site in board["alerts"] if site["id"] == "loc-lon")
          print("London HQ:", london["alert_level"], "down:", london["down_device_count"])
          assert london["down_device_count"] == 2, london
          PY

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs --tail=200

  # -----------------------------------------------------------------------
  # The HTTPS and sign-in proxy (#423): the real nginx config and compose
  # files, a stub in place of oauth2-proxy, and the mock Nautobot.
  # -----------------------------------------------------------------------
  proxy-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:reverse-proxy/compose.yml:reverse-proxy/ci/compose.yml
      PUBLIC_HOSTNAME: localhost
      AUTH_PROXY_SECRET: ci-proxy-secret-not-for-production
      OIDC_ISSUER_URL: https://idp.example.com
      OIDC_CLIENT_ID: nautobot-maps
      OIDC_CLIENT_SECRET: unused-by-the-stub
      OIDC_LOGOUT_URL: https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/
      OAUTH2_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
      NAUTOBOT_URL: http://mock-nautobot:8080
      NAUTOBOT_TOKEN: demo-token
      AUTH_OPERATOR_GROUPS: noc-operators

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Without a certificate nginx says where it goes (#667)
        run: |
          set +e
          out=$(docker compose run --rm --no-deps nginx 2>&1)
          status=$?
          set -e
          echo "$out" | tail -n 5
          test "$status" -ne 0
          echo "$out" | grep -q "missing or empty in reverse-proxy/certs/: fullchain.pem privkey.pem"

      - name: A self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout reverse-proxy/certs/privkey.pem -out reverse-proxy/certs/fullchain.pem

      - name: Start the app behind the proxy
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: A status link and token (#527)
        run: |
          # The tenant is known once the first Nautobot sync is done.
          for attempt in $(seq 1 60); do
            if link=$(docker compose exec -T api python -m app status-link "Acme Corp" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          token=$(docker compose exec -T api python -m app token create smoke-status --role status --tenant "Acme Corp" 2>/dev/null)
          echo "::add-mask::$token"
          echo "STATUS_LINK=$link" >> "$GITHUB_ENV"
          echo "STATUS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: The proxy's rules
        run: python3 reverse-proxy/ci/smoke.py https://localhost:443 http://localhost:80

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

  images:
    # One image per folder (#672): built as the README says, run behind the reverse
    # proxy with a stub oauth2-proxy and the mock Nautobot, and checked as proxy-smoke
    # checks the one-image setup.
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: reverse-proxy/ci/images.compose.yml
      OIDC_LOGOUT_URL: https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: A company CA and the proxy's certificate
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=CI Company CA" \
            -keyout /tmp/ca.key -out certs/company-ca.crt
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout reverse-proxy/certs/privkey.pem -out reverse-proxy/certs/fullchain.pem

      - name: Build the three images (the request's commands)
        run: |
          (cd api && docker build --build-context certs=../certs -t nocwatch-api .)
          (cd api && docker build --build-context certs=../certs --build-context docs=.. -t nautobot-maps-api:ci .)
          (cd web && docker build -t nocwatch-web -t nautobot-maps-web:ci .)
          (cd reverse-proxy && docker build -t nocwatch-reverse-proxy -t nautobot-maps-reverse-proxy:ci \
            --build-arg DOMAIN=localhost --build-arg API_PORT=4200 .)

      - name: Scan the API and web images (Trivy)
        run: |
          for image in nautobot-maps-api:ci nautobot-maps-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image"
          done

      - name: What each image holds
        run: |
          # The certs context's CA is trusted by outgoing HTTPS.
          docker run --rm --entrypoint python nautobot-maps-api:ci -c "
          import os, ssl
          context = ssl.create_default_context(cafile=os.environ['SSL_CERT_FILE'])
          names = [dict(x[0] for x in c['subject']).get('commonName') for c in context.get_ca_certs()]
          assert 'CI Company CA' in names, 'the company CA is not trusted'
          print('company CA trusted, with', len(names), 'others')"
          # The docs context: the help pages' files; without it, none.
          docker run --rm --entrypoint sh nautobot-maps-api:ci -c 'test -f /app/README.md && test -f /app/docs/operations.md'
          docker run --rm --entrypoint sh nocwatch-api -c 'test ! -e /app/README.md && test -z "$(ls -A /app/docs)"'
          # The proxy needs DOMAIN, and says which settings are missing at start.
          if (cd reverse-proxy && docker build -q . 2>/tmp/no-domain.log); then exit 1; fi
          grep -q "Set --build-arg DOMAIN" /tmp/no-domain.log
          # INCLUDE_CERTS=false (reverse-proxy/compose.yml): no key in the image, even when there.
          (cd reverse-proxy && docker build -q -t proxy-no-certs:ci --build-arg DOMAIN=localhost \
            --build-arg INCLUDE_CERTS=false .)
          docker run --rm --entrypoint sh proxy-no-certs:ci -c 'test -z "$(ls -A /etc/nginx/certs)"'
          docker run --rm --entrypoint sh nautobot-maps-reverse-proxy:ci -c 'test -s /etc/nginx/certs/privkey.pem'
          if docker run --rm nautobot-maps-reverse-proxy:ci > /tmp/no-settings.log 2>&1; then exit 1; fi
          tail -n 3 /tmp/no-settings.log
          grep -q "set AUTH_PROXY_SECRET OIDC_ISSUER_URL" /tmp/no-settings.log

      - name: Start the three images behind the proxy
        run: docker compose up -d --wait --wait-timeout 180

      - name: The API and the pages run as non-root users
        run: |
          for service in api web; do
            uid=$(docker compose exec -T "$service" id -u)
            echo "$service: uid=$uid"
            test "$uid" != "0"
          done

      - name: A status link and token (#527)
        run: |
          for attempt in $(seq 1 60); do
            if link=$(docker compose exec -T api python -m app status-link "Acme Corp" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          token=$(docker compose exec -T api python -m app token create smoke-status --role status --tenant "Acme Corp" 2>/dev/null)
          echo "::add-mask::$token"
          echo "STATUS_LINK=$link" >> "$GITHUB_ENV"
          echo "STATUS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: The proxy's rules
        run: python3 reverse-proxy/ci/smoke.py https://localhost:443 http://localhost:80

      - name: The pages from the web image, the API's paths to the API
        run: python3 reverse-proxy/ci/images_check.py https://localhost:443

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200
