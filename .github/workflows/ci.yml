name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint: ruff for the files outside api/ and web/ (e2e, demo, scripts, the
  # proxy's CI), with the root pyproject.toml's settings and api/'s ruff
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Ruff lint
        # github format turns findings into annotations on the PR diff.
        run: uv run --project api --locked ruff check --output-format=github .

      - name: Ruff format
        # Also runs when lint fails, so one CI run reports both.
        if: success() || failure()
        run: uv run --project api --locked ruff format --check --diff .

      - name: Shell scripts (#765)
        # shellcheck is on GitHub's runners.
        if: success() || failure()
        run: shellcheck scripts/ci/*.sh

      - name: No committed dependencies
        # node_modules is git-ignored; a `git add -A` after an install once
        # committed 941 files of it (#189).
        if: success() || failure()
        run: test -z "$(git ls-files node_modules web/node_modules)"

  # -----------------------------------------------------------------------
  # The new backend, api/ (#572): its own uv project, ruff, migrations, tests
  # (incl. "web/api/openapi.json is the app's spec").
  # -----------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # The version: api/pyproject.toml's required-version.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      # PostgreSQL in Docker, ruff, migrations, pytest: scripts/ci/test.sh (#765),
      # the same as GitLab's job and a local run.
      - name: Ruff, migrations and tests
        run: scripts/ci/test.sh api

  # -----------------------------------------------------------------------
  # The new frontend, web/ (#572): API types current, types, lint, tests, build.
  # -----------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: API types, types, lint, formatting, unit tests and static build
        run: scripts/ci/test.sh web

  # -----------------------------------------------------------------------
  # Known vulnerabilities in the locked dependencies (#186)
  # -----------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Python dependencies (pip-audit, api/uv.lock)
        working-directory: api
        # Every group: the image's packages, the dev tools and Playwright.
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt > requirements.audit.txt
          uv tool run pip-audit --strict --require-hashes --disable-pip -r requirements.audit.txt

      - name: The pages (bun audit, #463, #635)
        # High or critical fails, except the advisories scripts/audit.mjs
        # accepts, each with no fix released and out of production's reach.
        if: success() || failure()
        working-directory: web
        run: bun --bun scripts/audit.mjs

  # -----------------------------------------------------------------------
  # End-to-end in Chromium (#294): the app with the mock Nautobot and
  # PostgreSQL, driven like a user (board, + Case, history export, wall,
  # map, availability, status page), in light and dark.
  # -----------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # The version: api/pyproject.toml's required-version.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: The app on the mock Nautobot, then the browser tests
        run: scripts/ci/test.sh e2e

      - name: App and mock logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: |
            app.log
            mock.log
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # Integration tests against a real Nautobot 3.x instance
  # -----------------------------------------------------------------------
  integration-nautobot:
    runs-on: ubuntu-latest

    services:
      # api/'s live test (#600): its own database, beside the Nautobot stack's.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_test
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U api -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Nautobot stack
        working-directory: development
        run: docker compose up -d --wait --wait-timeout 300

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Seed Nautobot with test data
        run: uv run --project api --locked python development/seed_nautobot.py
        env:
          NAUTOBOT_URL: "http://localhost:8080"
          NAUTOBOT_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"

      - name: The sync and the clients against the real Nautobot (#600)
        working-directory: api
        run: |
          uv sync --locked
          uv run pytest tests/test_nautobot_live.py -v
        env:
          API_TEST_DATABASE_URL: "postgresql://api:api@127.0.0.1:5433/api_test"
          NAUTOBOT_LIVE_URL: "http://localhost:8080"
          NAUTOBOT_LIVE_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"

      - name: Dump Nautobot logs on failure
        if: failure()
        working-directory: development
        run: docker compose logs nautobot --tail=200

  # -----------------------------------------------------------------------
  # AD sign-in (#717) against a real Active Directory: a Samba AD domain
  # controller on the runner, LDAPS with its own CA (development/samba_ad.sh)
  # -----------------------------------------------------------------------
  ad-live:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_test
          POSTGRES_USER: api
          POSTGRES_PASSWORD: api
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U api -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Samba AD
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q samba samba-ad-dc
          # The packaged file-server daemons would hold the ports the DC needs.
          sudo systemctl stop smbd nmbd winbind samba-ad-dc 2>/dev/null || true

      - name: Start the domain controller
        run: development/samba_ad.sh start

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: api
          enable-cache: true

      - name: Sign in against it (#717)
        working-directory: api
        run: |
          uv sync --locked
          uv run pytest tests/test_ad_live.py -v
        env:
          API_TEST_DATABASE_URL: "postgresql://api:api@127.0.0.1:5433/api_test"
          AD_LIVE_URL: "ldaps://dc1.nmaps.test"
          AD_LIVE_CA_FILE: "/tmp/nms-dc/ca.pem"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Build the pages and install Chromium
        run: |
          (cd web && bun install --frozen-lockfile --ignore-scripts && bun --bun run generate)
          (cd api && uv sync --locked --group e2e && uv run python -m playwright install --with-deps chromium)

      - name: Sign in on the page, in Chromium (#723)
        env:
          NAUTOBOT_URL: "http://127.0.0.1:8080"
          NAUTOBOT_TOKEN: "demo-token"
          NAUTOBOT_MAPS_DATABASE_URL: "postgresql://api:api@127.0.0.1:5433/ad_e2e"
          FLASK_RUN_PORT: "5057"
          AUTH_MODE: header
          AUTH_REQUIRE_VIEWER: "true"
          LDAP_URL: "ldaps://dc1.nmaps.test"
          LDAP_BASE_DN: "DC=nmaps,DC=test"
          LDAP_BIND_DN: "svc-maps@nmaps.test"
          # development/samba_ad.sh's test-only service account.
          LDAP_BIND_PASSWORD: "Svc-Pass-2026!x"
          JWT_SIGNING_SECRET: "ci-jwt-secret-not-for-production-0123456789"
          E2E_AD_BASE_URL: "http://127.0.0.1:5057"
        run: |
          # A database of its own: the tests above leave theirs as they end.
          (cd api && uv run python - <<'EOF'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://api:api@127.0.0.1:5433/api_test")
              await conn.execute("CREATE DATABASE ad_e2e")
              await conn.close()
          asyncio.run(main())
          EOF
          )
          # Every setting (#760: no defaults); the step's env wins over the file.
          cp api/local.env api/.env
          (cd api && uv run python -m app migrate && uv run python -m app identity create jdoe --role noc)
          uv run --project api python demo/mock_nautobot.py > mock.log 2>&1 &
          # The test domain's CA, as text (#739: no CA files).
          export EXTRA_CA_PEM="$(cat /tmp/nms-dc/ca.pem)"
          (cd api && uv run python run.py) > app.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS -o /dev/null "$E2E_AD_BASE_URL/healthz" && break; sleep 1; done
          uv run --project api python -m pytest e2e/test_ad_sign_in.py -v

      - name: The app's log on failure
        if: failure()
        run: tail -n 100 app.log || true

  # -----------------------------------------------------------------------
  # Docker smoke test: build the image and run the demo stack for real
  # -----------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The images are scanned by the images job (#674): the same Dockerfiles.
      - name: The compose files are valid on their own and with the proxy
        env:
          PUBLIC_HOSTNAME: maps.example.com
          AUTH_PROXY_SECRET: x
          OIDC_ISSUER_URL: https://idp.example.com
          OIDC_CLIENT_ID: x
          OIDC_CLIENT_SECRET: x
          OAUTH2_COOKIE_SECRET: 0123456789abcdef0123456789abcdef
        run: |
          # Every container reads .env (#739); compose needs the file to be there.
          touch .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f reverse-proxy/compose.yml config -q
          docker compose -f docker-compose.yml -f reverse-proxy/compose.app-sign-in.yml config -q
          rm .env

      - name: Build and start the demo stack
        # --wait blocks until every container is running and healthy
        # (api and web via their images' HEALTHCHECK, the mock via its compose one).
        run: docker compose -f demo/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: The .env check runs in the image (#758)
        # As docs/configuration.md says to run it, with the file on stdin. .env.example has
        # nothing unread or invalid (exit 0); a broken one exits 1 and names the line.
        run: |
          check() { docker compose -f demo/docker-compose.yml run --rm --no-deps -T --entrypoint python api -m app.check_env -; }
          check < .env.example
          printf 'LOG_LEVEL=LOUD\nAPI_PORT=1\n' > broken.env
          if check < broken.env > report.txt; then echo "a broken .env passed"; exit 1; fi
          cat report.txt
          grep -q 'API_PORT (line 2)' report.txt && grep -q 'Invalid LOG_LEVEL' report.txt
          rm broken.env report.txt

      - name: The API and the pages run as non-root users
        run: |
          for service in api web; do
            uid=$(docker compose -f demo/docker-compose.yml exec -T "$service" id -u)
            echo "$service: uid=$uid"
            test "$uid" != "0"
          done

      - name: Health endpoint and alert board work end to end
        # On port 5000, the web image's: it passes the API's paths on to the API.
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:5000" + path, timeout=10) as resp:
                  return json.load(resp)

          health = get("/healthz")
          print("healthz:", health)
          assert health["status"] == "ok", health

          # Fresh database: the first request starts the sync; poll like the UI.
          deadline = time.monotonic() + 90
          board = get("/api/v1/alerts")
          while (board.get("sync_pending") or not board["alerts"]) and time.monotonic() < deadline:
              time.sleep(2)
              board = get("/api/v1/alerts")
          london = next(site for site in board["alerts"] if site["id"] == "loc-lon")
          print("London HQ:", london["alert_level"], "down:", london["down_device_count"])
          assert london["down_device_count"] == 2, london
          PY

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs --tail=200

  # -----------------------------------------------------------------------
  # The HTTPS and sign-in proxy (#423): the real nginx config and compose
  # files, a stub in place of oauth2-proxy, and the mock Nautobot.
  # -----------------------------------------------------------------------
  proxy-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:reverse-proxy/compose.yml:reverse-proxy/ci/compose.yml:reverse-proxy/ci/oauth2-proxy.compose.yml
      # smoke.py's: the logout address it expects after Sign out.
      OIDC_LOGOUT_URL: https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The settings, in .env as a deployment has them (#739)
        run: |
          # Every setting (#760: no defaults), then the deployment's own: the last wins.
          cp api/local.env .env
          cat >> .env <<'EOF'
          POSTGRES_DB=nautobot_maps
          POSTGRES_USER=nautobot_maps
          POSTGRES_PASSWORD=nautobot_maps
          NAUTOBOT_MAPS_DATABASE_URL=postgresql://nautobot_maps:nautobot_maps@postgres:5432/nautobot_maps
          CACHE_TYPE=RedisCache
          CACHE_REDIS_URL=redis://redis:6379/0
          API_URL=http://api:5000
          NAUTOBOT_URL=http://mock-nautobot:8080
          NAUTOBOT_TOKEN=demo-token
          PUBLIC_HOSTNAME=localhost
          AUTH_MODE=header
          AUTH_REQUIRE_VIEWER=true
          AUTH_TRUSTED_PROXIES=172.30.0.10/32
          AUTH_PROXY_SECRET=ci-proxy-secret-not-for-production
          AUTH_SIGN_OUT_URL=/oauth2/sign_out
          AUTH_OPERATOR_GROUPS=noc-operators
          OIDC_ISSUER_URL=https://idp.example.com
          OIDC_CLIENT_ID=nautobot-maps
          OIDC_LOGOUT_URL=https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/
          OAUTH2_PROXY_CLIENT_SECRET=unused-by-the-stub
          OAUTH2_PROXY_COOKIE_SECRET=0123456789abcdef0123456789abcdef
          EOF

      - name: Without a certificate nginx says where it goes (#667)
        run: |
          set +e
          out=$(docker compose run --rm --no-deps nginx 2>&1)
          status=$?
          set -e
          echo "$out" | tail -n 5
          test "$status" -ne 0
          echo "$out" | grep -q "missing or empty in reverse-proxy/certs/: tls.cert tls.privkey"

      - name: The certificate under its old names says how to rename it (#768)
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout reverse-proxy/certs/privkey.pem -out reverse-proxy/certs/fullchain.pem
          set +e
          out=$(docker compose run --rm --no-deps nginx 2>&1)
          status=$?
          set -e
          echo "$out" | tail -n 5
          test "$status" -ne 0
          echo "$out" | grep -q "mv fullchain.pem tls.cert && mv privkey.pem tls.privkey"

      - name: Renamed as it says; a key without a password (no tls.password)
        run: |
          cd reverse-proxy/certs
          mv fullchain.pem tls.cert && mv privkey.pem tls.privkey

      - name: Start the app behind the proxy
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: A status link and token (#527)
        run: |
          # The tenant is known once the first Nautobot sync is done.
          for attempt in $(seq 1 60); do
            if link=$(docker compose exec -T api python -m app status-link "Acme Corp" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          token=$(docker compose exec -T api python -m app token create smoke-status --role status --tenant "Acme Corp" 2>/dev/null)
          echo "::add-mask::$token"
          echo "STATUS_LINK=$link" >> "$GITHUB_ENV"
          echo "STATUS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: The proxy's rules
        run: python3 reverse-proxy/ci/smoke.py https://localhost:443 http://localhost:80

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

  proxy-smoke-app:
    # The bundled proxy with the app's own sign-in (#723): nginx built with SIGN_IN=app,
    # no oauth2-proxy.  No domain controller here (a sign-in answers 503); the AD
    # sign-in itself is the ad-live job's.  A signed-in session: the app's token for an
    # identity made here.
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:reverse-proxy/compose.app-sign-in.yml:reverse-proxy/ci/compose.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The settings, in .env as a deployment has them (#739)
        run: |
          # Every setting (#760: no defaults), then the deployment's own: the last wins.
          cp api/local.env .env
          cat >> .env <<'EOF'
          POSTGRES_DB=nautobot_maps
          POSTGRES_USER=nautobot_maps
          POSTGRES_PASSWORD=nautobot_maps
          NAUTOBOT_MAPS_DATABASE_URL=postgresql://nautobot_maps:nautobot_maps@postgres:5432/nautobot_maps
          CACHE_TYPE=RedisCache
          CACHE_REDIS_URL=redis://redis:6379/0
          API_URL=http://api:5000
          NAUTOBOT_URL=http://mock-nautobot:8080
          NAUTOBOT_TOKEN=demo-token
          PUBLIC_HOSTNAME=localhost
          AUTH_MODE=header
          AUTH_REQUIRE_VIEWER=true
          AUTH_TRUSTED_PROXIES=172.30.0.10/32
          AUTH_PROXY_SECRET=ci-proxy-secret-not-for-production
          LDAP_URL=ldap://192.0.2.1
          LDAP_ALLOW_PLAINTEXT=true
          LDAP_BASE_DN=DC=example,DC=local
          LDAP_TIMEOUT_SECONDS=2
          JWT_SIGNING_SECRET=ci-jwt-secret-not-for-production-0123456789
          EOF

      - name: A self-signed certificate, its key encrypted (tls.password, #768)
        run: |
          openssl req -x509 -newkey rsa:2048 -days 2 -subj "/CN=localhost" \
            -passout pass:ci-key-password -keyout reverse-proxy/certs/tls.privkey \
            -out reverse-proxy/certs/tls.cert
          grep -q "ENCRYPTED PRIVATE KEY" reverse-proxy/certs/tls.privkey
          echo ci-key-password > reverse-proxy/certs/tls.password

      - name: Start the app behind the proxy
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: An identity, signed in
        run: |
          docker compose exec -T api python -m app identity create olga --role operator
          session=$(docker compose exec -T api python -c "import asyncio; from app.core.settings import settings; from app.services import identity_service, login_service; print(login_service.issue(asyncio.run(identity_service.lookup('olga')), settings)[0])" 2>/dev/null)
          echo "::add-mask::$session"
          echo "SESSION=$session" >> "$GITHUB_ENV"

      - name: The proxy's rules
        run: python3 reverse-proxy/ci/smoke_app.py https://localhost:443 http://localhost:80

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

  images:
    # One image per folder (#672): built as the README says, run behind the reverse
    # proxy with a stub oauth2-proxy and the mock Nautobot, and checked as proxy-smoke
    # checks the one-image setup.
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: reverse-proxy/ci/images.compose.yml
      OIDC_LOGOUT_URL: https://idp.example.com/logout?post_logout_redirect_uri=https://localhost/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: A company CA and the proxy's certificate
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=CI Company CA" \
            -keyout /tmp/ca.key -out certs/company-ca.crt
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -keyout reverse-proxy/certs/tls.privkey -out reverse-proxy/certs/tls.cert

      - name: Build the three images (the request's commands)
        run: |
          (cd api && docker build --build-context certs=../certs -t nocwatch-api .)
          (cd api && docker build --build-context certs=../certs --build-context docs=.. -t nautobot-maps-api:ci .)
          (cd web && docker build -t nocwatch-web -t nautobot-maps-web:ci .)
          (cd reverse-proxy && docker build -t nocwatch-reverse-proxy -t nautobot-maps-reverse-proxy:ci \
            --build-arg DOMAIN=localhost --build-arg API_PORT=4200 .)

      - name: The proxy builds on a host without IPv6 (#680)
        # nginx -t in the build opens the listening sockets; without IPv6 the [::]
        # ones must go first. IF_INET6=/dev/null (empty) is the script's own test hook:
        # the runners have IPv6, a kernel without it can't be had here.
        run: |
          (cd reverse-proxy && docker build --no-cache --progress=plain --target config \
            --build-arg DOMAIN=localhost --build-arg IF_INET6=/dev/null . 2>&1 | tee /tmp/no-ipv6.log)
          grep -q "no IPv6 on this host: listening on IPv4 only" /tmp/no-ipv6.log
          grep -q "test is successful" /tmp/no-ipv6.log

      - name: Scan the API and web images (Trivy)
        run: |
          for image in nautobot-maps-api:ci nautobot-maps-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$image"
          done

      - name: What each image holds
        run: |
          set -x
          # The certs context's CA is trusted by outgoing HTTPS.
          docker run --rm --entrypoint python nautobot-maps-api:ci -c "
          import os, ssl
          context = ssl.create_default_context(cafile=os.environ['SSL_CERT_FILE'])
          names = [dict(x[0] for x in c['subject']).get('commonName') for c in context.get_ca_certs()]
          assert 'CI Company CA' in names, 'the company CA is not trusted'
          print('company CA trusted, with', len(names), 'others')"
          # The docs context: the help pages' files; without it, none.
          docker run --rm --entrypoint sh nautobot-maps-api:ci -c 'test -f /app/README.md && test -f /app/docs/operations.md'
          docker run --rm --entrypoint sh nocwatch-api -c 'test ! -e /app/README.md && test -z "$(ls -A /app/docs)"'
          # The proxy needs DOMAIN, and says which settings are missing at start.
          if (cd reverse-proxy && docker build -q . 2>/tmp/no-domain.log); then exit 1; fi
          grep -q "Set --build-arg DOMAIN" /tmp/no-domain.log
          # No certificate or key in the image (#768), even with them in reverse-proxy/certs/,
          # and no Python (only substitute.py's build stage has it).
          docker run --rm --entrypoint sh nautobot-maps-reverse-proxy:ci -c \
            'test -z "$(ls -A /etc/nginx/ssl)" && ! command -v python3 && test -f /etc/nginx/.config-checked'
          # A build arg that would change nginx.conf's syntax is refused (substitute.py).
          if (cd reverse-proxy && docker build -q --build-arg "DOMAIN=localhost; return 200" . 2>/tmp/bad-domain.log); then exit 1; fi
          tail -n 25 /tmp/bad-domain.log
          grep -q "DOMAIN must be set, without spaces" /tmp/bad-domain.log
          if docker run --rm nautobot-maps-reverse-proxy:ci > /tmp/no-settings.log 2>&1; then exit 1; fi
          tail -n 3 /tmp/no-settings.log
          grep -q "set AUTH_PROXY_SECRET OIDC_ISSUER_URL" /tmp/no-settings.log

      - name: Start the three images behind the proxy
        run: docker compose up -d --wait --wait-timeout 180

      - name: The API and the pages run as non-root users
        run: |
          for service in api web; do
            uid=$(docker compose exec -T "$service" id -u)
            echo "$service: uid=$uid"
            test "$uid" != "0"
          done

      - name: A status link and token (#527)
        run: |
          for attempt in $(seq 1 60); do
            if link=$(docker compose exec -T api python -m app status-link "Acme Corp" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          token=$(docker compose exec -T api python -m app token create smoke-status --role status --tenant "Acme Corp" 2>/dev/null)
          echo "::add-mask::$token"
          echo "STATUS_LINK=$link" >> "$GITHUB_ENV"
          echo "STATUS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: The proxy's rules
        run: python3 reverse-proxy/ci/smoke.py https://localhost:443 http://localhost:80

      - name: The pages from the web image, the API's paths to the API
        run: python3 reverse-proxy/ci/images_check.py https://localhost:443

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200
