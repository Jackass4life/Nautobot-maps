name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Lint: ruff (config in pyproject.toml, version pinned in requirements-dev.txt)
  # and ESLint for static/js (eslint.config.mjs, versions in package-lock.json)
  # -----------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        # requirements-dev.txt is a hashed lock file; take just ruff's pin.
        run: pip install "$(grep -o '^ruff==[0-9.]*' requirements-dev.txt)"

      - name: Ruff lint
        # github format turns findings into annotations on the PR diff.
        run: ruff check --output-format=github .

      - name: Ruff format
        # Also runs when lint fails, so one CI run reports both.
        if: success() || failure()
        # Fails if any file is not formatted; run `ruff format .` locally to fix.
        run: ruff format --check --diff .

      - name: No committed dependencies
        # node_modules is git-ignored; a `git add -A` after `npm ci` once
        # committed 941 files of it (#189).
        if: success() || failure()
        run: test -z "$(git ls-files node_modules)"

      - name: Set up Node
        if: success() || failure()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: ESLint
        # Also runs when ruff fails, so one CI run reports everything.
        if: success() || failure()
        run: |
          npm ci --no-audit --no-fund
          npx eslint static/js

  # -----------------------------------------------------------------------
  # Known vulnerabilities in the locked dependencies (#186)
  # -----------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt
          pip-audit --strict -r requirements-dev.txt

      - name: Lock files match the .in files
        # Fails if someone edited requirements*.in without recompiling.
        if: success() || failure()
        run: |
          pip install pip-tools
          pins() { grep -oE '^[A-Za-z0-9._-]+==[^ ]+' "$1" | sort; }
          for name in requirements requirements-dev; do
            # Start from the committed lock, so only a change the .in file
            # requires shows up (not newer releases of transitive packages).
            cp "$name.txt" "$name.check.txt"
            pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe -o "$name.check.txt" "$name.in"
            diff <(pins "$name.txt") <(pins "$name.check.txt")
          done

      - name: JavaScript dev tools (npm audit)
        if: success() || failure()
        run: npm audit --audit-level=high

  # -----------------------------------------------------------------------
  # Unit + mock-integration tests (fast, Python matrix)
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    # The persistence tests need PostgreSQL (same major version as
    # docker-compose.yml). In CI they fail instead of skipping without it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nautobot_maps_test
          POSTGRES_USER: nautobot_maps
          POSTGRES_PASSWORD: nautobot_maps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nautobot_maps -d nautobot_maps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Start mock Nautobot server
        run: |
          python demo/mock_nautobot.py &
          # Wait until it answers instead of sleeping a fixed time.
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Mock Nautobot did not become ready within 30s" >&2
          exit 1
        env:
          FLASK_RUN_PORT: "8080"

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          NAUTOBOT_URL: "http://127.0.0.1:8080"
          NAUTOBOT_TOKEN: "test-token"
          TEST_DATABASE_URL: "postgresql://nautobot_maps:nautobot_maps@127.0.0.1:5432/nautobot_maps_test"
          NAUTOBOT_VERIFY_SSL: "true"

  # -----------------------------------------------------------------------
  # Integration tests against a real Nautobot 3.x instance
  # -----------------------------------------------------------------------
  integration-nautobot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Nautobot stack
        working-directory: development
        run: docker compose up -d --wait --wait-timeout 300

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Seed Nautobot with test data
        run: python development/seed_nautobot.py
        env:
          NAUTOBOT_URL: "http://localhost:8080"
          NAUTOBOT_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"

      - name: Run live integration tests
        run: python -m pytest tests/test_nautobot_live.py -v
        env:
          NAUTOBOT_LIVE_URL: "http://localhost:8080"
          NAUTOBOT_LIVE_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"
          NAUTOBOT_URL: "http://localhost:8080"
          NAUTOBOT_TOKEN: "aaaa-bbbb-cccc-dddd-eeee"
          NAUTOBOT_VERIFY_SSL: "false"

      - name: Dump Nautobot logs on failure
        if: failure()
        working-directory: development
        run: docker compose logs nautobot --tail=200

  # -----------------------------------------------------------------------
  # Docker smoke test: build the image and run the demo stack for real
  # -----------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the image (Trivy)
        # Known fixable HIGH/CRITICAL vulnerabilities in the OS packages and
        # Python libraries of the image fail the build (#186).
        run: |
          docker build -t nautobot-maps:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress nautobot-maps:ci

      - name: Build and start the demo stack
        # --wait blocks until every container is running and healthy
        # (the app via the image HEALTHCHECK, the mock via its compose one).
        run: docker compose -f demo/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: App container runs as a non-root user
        run: |
          uid=$(docker compose -f demo/docker-compose.yml exec -T nautobot-maps id -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Health endpoint and alert board work end to end
        run: |
          python3 - <<'PY'
          import json, time, urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:5000" + path, timeout=10) as resp:
                  return json.load(resp)

          health = get("/healthz")
          print("healthz:", health)
          assert health["status"] == "ok", health

          # Fresh database: the first request starts the sync; poll like the UI.
          deadline = time.monotonic() + 90
          board = get("/api/alerts")
          while (board.get("sync_pending") or not board["alerts"]) and time.monotonic() < deadline:
              time.sleep(2)
              board = get("/api/alerts")
          london = next(site for site in board["alerts"] if site["id"] == "loc-lon")
          print("London HQ:", london["alert_level"], "down:", london["down_device_count"])
          assert london["down_device_count"] == 2, london
          PY

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f demo/docker-compose.yml logs --tail=200
