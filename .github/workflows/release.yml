name: Release

# Pushing a tag vX.Y.Z publishes ghcr.io/<owner>/nautobot-maps:X.Y.Z (and
# X.Y, latest) and a GitHub Release with that version's CHANGELOG section
# (#195). On pull requests that touch the image or this workflow, the same
# build runs without publishing, so a broken release is caught before tagging.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        # The tag must have a "## [X.Y.Z]" section: nothing is published for a
        # version the changelog doesn't describe.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section '## [$version]': move the [Unreleased] entries under it first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # metadata-action lower-cases it, as registries require.
          images: ghcr.io/${{ github.repository_owner }}/nautobot-maps
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
