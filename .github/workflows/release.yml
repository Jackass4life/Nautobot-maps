name: Release

# Pushing a tag vX.Y.Z publishes ghcr.io/<owner>/nautobot-maps-api:X.Y.Z and
# ghcr.io/<owner>/nautobot-maps-web:X.Y.Z (and X.Y, latest; #674: one image per
# folder) and a GitHub Release with that version's CHANGELOG section (#195). The
# reverse proxy's image isn't published: its DOMAIN is built in, so each install
# builds its own. On pull requests that touch the images or this workflow, the same
# builds run without publishing, so a broken release is caught before tagging.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - api/Dockerfile
      - api/.dockerignore
      - web/Dockerfile
      - web/.dockerignore
      - .dockerignore
      - api/pyproject.toml
      - api/uv.lock
      - api/docker-entrypoint.sh
      - api/gunicorn_config.py
      - web/package.json
      - web/bun.lock
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push to ghcr.io
      id-token: write      # provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        # The tag must have a "## [X.Y.Z]" section: nothing is published for a
        # version the changelog doesn't describe.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section '## [$version]': move the [Unreleased] entries under it first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The API image's name and tags
        id: api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lower-cases it, as registries require.
          images: ghcr.io/${{ github.repository_owner }}/nautobot-maps-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - name: The API image (and push on a tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          # The help pages' files (api/Dockerfile).
          build-contexts: docs=.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.api.outputs.tags }}
          labels: ${{ steps.api.outputs.labels }}
          provenance: true
          sbom: true

      - name: The web image's name and tags
        id: web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nautobot-maps-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - name: The web image (and push on a tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          provenance: true
          sbom: true

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
