# Weekly dependency updates (#186). Grouped so each ecosystem is one PR a week.
version: 2
updates:
  # api/ (uv.lock) and web/ (bun.lock, #635)
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Nuxt is pinned to 4.2.x on purpose (#572); a newer minor is a
      # deliberate upgrade, not a weekly bump (#580).
      - dependency-name: nuxt
        update-types: [version-update:semver-major, version-update:semver-minor]
      # openapi-typescript 7 needs TypeScript ^5 (#580).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Nuxt 4.2 uses vue-router ^4 (#580).
      - dependency-name: vue-router
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The images (#674): python:3.13-slim and uv (api/), oven/bun (web/, #635) and
  # nginx (reverse-proxy/), each in its folder's Dockerfile.
  - package-ecosystem: docker
    directories: [/api, /web, /reverse-proxy]
    schedule:
      interval: weekly
    ignore:
      # A new Python version (3.12 -> 3.14 counts as "minor") is a deliberate
      # change: add it to CI's test matrix and check the image scan first.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # oven/bun, the pages' build stage (#635): a new bun major version
      # goes with CI's bun-version and web/package.json's packageManager.
      - dependency-name: oven/bun
        update-types: [version-update:semver-major]
      # nginx follows its stable line (1.28, even minor versions); a new one is
      # a deliberate change, tested with reverse-proxy/ci (#423).
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]

  # postgres / redis images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version can't read the existing data volume:
      # it needs a dump and restore (README, "Backup and restore").
      - dependency-name: postgres
        update-types: [version-update:semver-major]
