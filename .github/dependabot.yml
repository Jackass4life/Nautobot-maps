# Weekly dependency updates (#186). Grouped so each ecosystem is one PR a week.
version: 2
updates:
  # requirements*.in → recompiled requirements*.txt (pip-compile)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # python:3.12-slim in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # postgres / redis images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
