# Weekly dependency updates (#186). Grouped so each ecosystem is one PR a week.
version: 2
updates:
  # requirements*.in → recompiled requirements*.txt (pip-compile)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Nuxt frontend (#463)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  # The new projects (#572): api/ (uv.lock) and web/ (package-lock.json)
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Nuxt is pinned to 4.2.x on purpose (#572); a newer minor is a
      # deliberate upgrade, not a weekly bump (#580).
      - dependency-name: nuxt
        update-types: [version-update:semver-major, version-update:semver-minor]
      # openapi-typescript 7 needs TypeScript ^5 (#580).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Nuxt 4.2 uses vue-router ^4 (#580).
      - dependency-name: vue-router
        update-types: [version-update:semver-major]

  # The new stack's image (it builds web/ too, #594) and compose file (#577)
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    ignore:
      # Python / Node versions are a deliberate change, as for the current image.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /deploy/next
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # python:3.12-slim and node:22-slim in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Python version (3.12 -> 3.14 counts as "minor") is a deliberate
      # change: add it to CI's test matrix and check the image scan first.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # node:22-slim, the frontend's build stage (#463): a new Node major
      # version goes with CI's node-version.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # postgres / redis images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version can't read the existing data volume:
      # it needs a dump and restore (README, "Backup and restore").
      - dependency-name: postgres
        update-types: [version-update:semver-major]
