# Optional: run the same checks as CI before each commit.
#   uv tool install pre-commit && pre-commit install
# Keep `rev` in sync with ruff in api/uv.lock. api/ uses its own config
# (api/pyproject.toml), the rest the root pyproject.toml's.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  # scripts/ci/*.sh (#765), as CI's lint job.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/ci/
