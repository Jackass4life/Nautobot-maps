# Optional: run the same checks as CI before each commit.
#   pip install pre-commit && pre-commit install
# Keep `rev` in sync with the ruff pin in requirements-dev.txt.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  # ESLint from package-lock.json (run `npm ci` once first).
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        files: ^static/js/.*\.js$
