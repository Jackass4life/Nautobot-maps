[project]
name = "api"
version = "0.1.0"
description = "Example FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "cachelib>=0.17.0",
    "fastapi>=0.162.0",
    "openapi-python[httpx]>=0.0.18",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "requests>=2.34.2",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The current app's contract declarations, copied unchanged (#598): docs/data-contract.md
# is rendered from their text, so they keep its line lengths and tuple style.
"app/services/contract_service.py" = ["E501", "RUF005"]
# Ported from nautobot_maps/ as they are (#600): its broad excepts around upstream
# calls are deliberate (a sync logs and goes on), its texts use "›" and long lines.
"app/services/inventory_service.py" = ["E501", "BLE001", "RUF001", "RUF002", "RUF003"]
# Tests ported from the current app's tests/ as they are (#600): its data has long lines
# and real-world text (en dashes in addresses).
"tests/test_inventory.py" = ["E501", "BLE001", "RUF001", "RUF002", "RUF003"]
"tests/test_location_country.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"tests/test_circuits_by_address.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
