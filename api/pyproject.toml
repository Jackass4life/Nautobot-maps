[project]
name = "api"
version = "0.3.1"
description = "Example FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "cachelib>=0.17.0",
    "fastapi>=0.162.0",
    "geopy>=2.5.0",
    "gunicorn>=23.0.0",
    "markdown-it-py>=4.2.0",
    "openapi-python[httpx]>=0.0.18",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "requests>=2.34.2",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]
e2e = [
    "playwright==1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
